# 기본은 기존 연결/수동 보관. 상시 flag 또는 명시한 단일 SHA도 enqueue만 수행. NAS auto gate는 별도다.
name: IoT Web OIDC and stage-only verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage_only:
        description: '빌드 산출물을 NAS HDD에 보관만 하기 (운영 반영 없음)'
        type: boolean
        default: false
      publisher_readiness:
        description: '전용 권한 준비 상태만 확인 (운영 승격 없음)'
        type: boolean
        default: false
      verify_build_inputs:
        description: '기존 빌드 입력 지문만 확인 (실키 번들은 공개 artifact에 올리지 않음)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: front-oidc-connect
  cancel-in-progress: false

jobs:
  oidc-connect:
    name: OIDC and NAS transport verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify identity and reject wrong audience
        env:
          TS_OIDC_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
        run: python3 .github/scripts/check-ci-oidc.py identity

      - name: Connect ephemeral CI node
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:iot-web-ci
          timeout: "30s"
          retry: "1"

      - name: Verify NAS host key and network isolation
        env:
          NAS_SSH_HOST_KEYS: ${{ vars.NAS_SSH_HOST_KEYS }}
        run: python3 .github/scripts/check-ci-oidc.py transport

  build-stage-artifact:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.stage_only) || (github.event_name == 'push' && (vars.FRONT_AUTO_PIPELINE_ENABLED == 'true' || (vars.FRONT_V2_VERIFY_SHA != '' && github.sha == vars.FRONT_V2_VERIFY_SHA))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install and verify clean checkout
        env:
          VITE_API_BASE_URL: https://iot-api.iwhya.kr
          VITE_USE_MOCK: 'false'
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run test -- --maxWorkers=2 --minWorkers=1
      - name: Build credential-free verification artifact
        env:
          VITE_API_BASE_URL: https://iot-api.iwhya.kr
          VITE_USE_MOCK: 'false'
        run: npm run build
      - name: Check preparation boundaries
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check disabled publisher and isolated rollback boundaries
        run: python3 -m unittest discover -s ops -p "test_*.py" -v
      - name: Prepare archive without NAS access
        run: bash .github/scripts/deploy-to-nas.sh --prepare-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: front-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/front-${{ github.sha }}-${{ github.run_id }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  verify-input-profile:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.stage_only && inputs.verify_build_inputs) || (github.event_name == 'push' && (vars.FRONT_AUTO_PIPELINE_ENABLED == 'true' || (vars.FRONT_V2_VERIFY_SHA != '' && github.sha == vars.FRONT_V2_VERIFY_SHA))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify existing input fingerprints without building a credential bundle
        env:
          CANDIDATE_INPUT_NONCE: ${{ secrets.FRONT_CANDIDATE_INPUT_NONCE }}
          VITE_API_BASE_URL: https://iot-api.iwhya.kr
          VITE_USE_MOCK: 'false'
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          python3 .github/scripts/check-build-inputs.py
      - name: Preserve blinded input verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: front-input-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/build-input-profile.json
          if-no-files-found: error
          retention-days: 7

  stage-only:
    if: always() && github.ref == 'refs/heads/main' && needs['oidc-connect'].result == 'success' && needs['build-stage-artifact'].result == 'success' && (needs['verify-input-profile'].result == 'success' || (needs['verify-input-profile'].result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.stage_only && !inputs.verify_build_inputs))
    needs: [oidc-connect, build-stage-artifact, verify-input-profile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: front-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/front-${{ github.sha }}-${{ github.run_id }}
      - name: Verify identity and reject wrong audience
        env:
          TS_OIDC_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
        run: python3 .github/scripts/check-ci-oidc.py identity
      - name: Connect ephemeral stage node
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:iot-web-ci
          timeout: '30s'
          retry: '1'
      - name: Verify NAS host key and network isolation
        env:
          NAS_SSH_HOST_KEYS: ${{ vars.NAS_SSH_HOST_KEYS }}
        run: python3 .github/scripts/check-ci-oidc.py transport
      - name: Transfer only to constrained HDD storage
        env:
          NAS_STAGE_SSH_KEY: ${{ secrets.NAS_STAGE_SSH_KEY }}
          NAS_SSH_HOST_KEYS: ${{ vars.NAS_SSH_HOST_KEYS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$NAS_STAGE_SSH_KEY"
          stage_key_file="$RUNNER_TEMP/front-stage-key"
          trap 'rm -f -- "$stage_key_file"' EXIT
          printf '%s\n' "$NAS_STAGE_SSH_KEY" > "$stage_key_file"
          unset NAS_STAGE_SSH_KEY
          export NAS_STAGE_KEY_FILE="$stage_key_file"
          export FRONT_STAGE_RELEASE="$GITHUB_WORKSPACE/.ci-artifacts/front-$GITHUB_SHA-$GITHUB_RUN_ID"
          bash .github/scripts/deploy-to-nas.sh --stage-only > "$RUNNER_TEMP/front-stage-receipt.json"
          cat "$RUNNER_TEMP/front-stage-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: front-stage-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/front-stage-receipt.json
          if-no-files-found: error
          retention-days: 7

  publisher-readiness:
    if: github.event_name == 'workflow_dispatch' && inputs.publisher_readiness && github.ref == 'refs/heads/main'
    needs: [oidc-connect]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify identity
        env:
          TS_OIDC_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
        run: python3 .github/scripts/check-ci-oidc.py identity
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:iot-web-ci
          timeout: '30s'
          retry: '1'
      - name: Verify pinned NAS host
        env:
          NAS_SSH_HOST_KEYS: ${{ vars.NAS_SSH_HOST_KEYS }}
        run: python3 .github/scripts/check-ci-oidc.py transport
      - name: Check fixed publisher readiness only
        env:
          NAS_PUBLISH_SSH_KEY: ${{ secrets.NAS_PUBLISH_SSH_KEY }}
          NAS_SSH_HOST_KEYS: ${{ vars.NAS_SSH_HOST_KEYS }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/front-publish-key"
          host_file="$RUNNER_TEMP/front-publish-known-hosts"
          trap 'rm -f -- "$key_file" "$host_file"' EXIT
          test -n "$NAS_PUBLISH_SSH_KEY"
          printf '%s\n' "$NAS_PUBLISH_SSH_KEY" > "$key_file"
          printf '%s\n' "$NAS_SSH_HOST_KEYS" | awk '$2=="ssh-ed25519" {print "100.88.40.125", $2, $3}' > "$host_file"
          unset NAS_PUBLISH_SSH_KEY
          timeout --signal=TERM --kill-after=5s 55s ssh -F /dev/null -i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$host_file" -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 -T iwh@100.88.40.125 'iot-web-publish readiness'


  enqueue-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (vars.FRONT_AUTO_PIPELINE_ENABLED == 'true' || (vars.FRONT_V2_VERIFY_SHA != '' && github.sha == vars.FRONT_V2_VERIFY_SHA))
    needs: [oidc-connect, build-stage-artifact, verify-input-profile, stage-only]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify identity and reject wrong audience
        env:
          TS_OIDC_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
        run: python3 .github/scripts/check-ci-oidc.py identity
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:iot-web-ci
          timeout: '30s'
          retry: '1'
      - name: Verify pinned NAS host and isolation
        env:
          NAS_SSH_HOST_KEYS: ${{ vars.NAS_SSH_HOST_KEYS }}
        run: python3 .github/scripts/check-ci-oidc.py transport
      - name: Enqueue identifiers and public fingerprint proof only
        env:
          GH_TOKEN: ${{ github.token }}
          NAS_PUBLISH_SSH_KEY: ${{ secrets.NAS_PUBLISH_SSH_KEY }}
          NAS_SSH_HOST_KEYS: ${{ vars.NAS_SSH_HOST_KEYS }}
        run: python3 .github/scripts/enqueue-front-release.py
